<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duduk Randomizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">tempat</p>
      <h1>duduk</h1>
      <div id="result" class="result" aria-live="polite">Loading...</div>

      <section class="meaning-box" aria-labelledby="meaning-title">
        <h2 id="meaning-title">Keterangan:</h2>
        <div id="meaning-list" class="meaning-list">
          A - Andreansyah Rahmattullah
          G - Muhammad Narendra Gema Akbar Raihan
          N - Neo Sheyka Isnaeni
          R - Reynaldi Continenta Putra
          T - M. Teguh Gabita
          Z - Zakqi Ramadhan
        </div>
      </section>

      <button id="shuffle-btn" type="button">duduk</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
